<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Обратная связь - Food Construct</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="container">
            <h1>Food Construct</h1>
            <nav>
                <ul>
                    <li><a href="index.html">О нас</a></li>
                    <li><a href="#">Собрать ланч</a></li>
                    <li><a href="#">Заказы</a></li>
                    <li><a href="login.html">Войти</a></li>
                    <li><a href="feedback.html">Обратная связь</a></li>
                    <li><a href="#contacts">Контакты</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container">
        <section>
            <h2>Обратная связь</h2>
            <form action="https://httpbin.org/post" method="POST" enctype="multipart/form-data">
                
                <label for="fio">ФИО:</label>
                <input type="text" id="fio" name="fio" placeholder="Иванов Иван Иванович" required>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="example@mail.ru" required>

                <fieldset>
                    <legend>Откуда узнали о нас?</legend>
                    <label><input type="radio" name="source" value="friends" checked> От друзей</label>
                    <label><input type="radio" name="source" value="internet"> Из интернета</label>
                    <label><input type="radio" name="source" value="advertising"> Из рекламы</label>
                </fieldset>

                <label for="type">Тип обращения:</label>
                <select id="type" name="type">
                    <option value="complaint">Жалоба</option>
                    <option value="suggestion" selected>Предложение</option>
                </select>

                <label for="message">Текст сообщения:</label>
                <textarea id="message" name="message" rows="5" placeholder="Введите ваше сообщение..."></textarea>

                <label for="file">Вложения:</label>
                <input type="file" id="file" name="file">

                <label class="checkbox-row">
                    <input type="checkbox" name="agreement" required> 
                    Даю согласие на обработку персональных данных
                </label>

                <button type="submit">Отправить</button>
            </form>
        </section>
    </main>

    <footer id="contacts">
        <div class="container">
            <p>Позвонить нам: <a href="tel:+70000000000">+7-000-000-00-00</a></p>
            <p>Email: <a href="mailto:foodconstruct@yandex.ru">foodconstruct@yandex.ru</a></p>
        </div>
    </footer>

</body>
</html>
