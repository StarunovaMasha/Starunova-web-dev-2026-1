<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Обратная связь</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="print.css" media="print">
</head>

<body>

<header>
    <div class="container">

        <h1>Гребная лига Москвы</h1>

        <nav>
            <a href="index.html">О соревнованиях</a>
            <a href="lunch.html">Собрать заявку</a>
            <a href="login.html">Вход</a>
            <a class="active" href="feedback.html">Обратная связь</a>
            <a href="index.html#contacts">Контакты</a>
        </nav>

    </div>
</header>

<main class="container">

    <h2>Обратная связь</h2>

    <form action="https://httpbin.org/post" method="post" enctype="multipart/form-data">

        <label for="fio">ФИО</label>
        <input id="fio" name="fio" type="text" required>

        <label for="email">Email</label>
        <input id="email" name="email" type="email" required>

        <fieldset>

            <legend>Откуда узнали о нас</legend>

            <label>
                <input type="radio" name="source" value="internet" required>
                Интернет
            </label>

            <label>
                <input type="radio" name="source" value="friends">
                От друзей
            </label>

            <label>
                <input type="radio" name="source" value="social">
                Социальные сети
            </label>

        </fieldset>

        <label for="type">Тип обращения</label>

        <select id="type" name="type">
            <option value="complaint">Жалоба</option>
            <option value="suggestion">Предложение</option>
        </select>

        <label for="message">Текст сообщения</label>

        <textarea id="message" name="message" rows="6" required></textarea>

        <label for="file">Вложение</label>
        <input id="file" name="file" type="file">

        <label class="check">
            <input type="checkbox" name="consent" value="yes" required>
            Даю согласие на обработку персональных данных
        </label>

        <button type="submit">Отправить</button>

    </form>

</main>

<footer id="contacts">
    <div class="container">

        <p>Гребная лига Москвы</p>

        <p>
            Телефон:
            <a href="tel:+70000000000">+7-000-000-00-00</a>
        </p>

        <p>
            Email:
            <a href="mailto:rowing@example.com">rowing@example.com</a>
        </p>

    </div>
</footer>

</body>
</html>
